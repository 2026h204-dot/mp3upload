<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오노추 - 오늘의 노래 추천</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDK 모듈 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc, deleteDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADfqll8HrBOzgPqYJ3gyZIgvq1WJzC9no",
      authDomain: "mp3upload-7cbc9.firebaseapp.com",
      projectId: "mp3upload-7cbc9",
      storageBucket: "mp3upload-7cbc9.firebasestorage.app",
      messagingSenderId: "1084960007120",
      appId: "1:1084960007120:web:2dbf711f9d1f9a85350fd5",
      measurementId: "G-81S0J2LRT2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.addDoc = addDoc;
    window.collection = collection;
    window.doc = doc;
    window.updateDoc = updateDoc;
    window.deleteDoc = deleteDoc;
    window.increment = increment;
    window.serverTimestamp = serverTimestamp;

    let allMusicList = [];

    // 실시간 DB 연동
    const q = query(collection(db, "music_list"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      allMusicList = [];
      snapshot.forEach((docSnap) => {
        allMusicList.push({ id: docSnap.id, ...docSnap.data() });
      });

      // 1. 선택된 오노추 삭제 시 재선정 또는 최초 선정
      if (allMusicList.length > 0) {
        if (!window.selectedOnochu || !allMusicList.some(m => m.id === window.selectedOnochu.id)) {
          const randomIndex = Math.floor(Math.random() * allMusicList.length);
          window.selectedOnochu = allMusicList[randomIndex];
        }
        renderOnochuCard(window.selectedOnochu);
      } else {
        document.getElementById("onochuContainer").innerHTML = `<div class="bg-slate-900 rounded-3xl p-8 text-center text-slate-400 font-bold">등록된 노래가 없습니다. 첫 노래를 공유해 보세요!</div>`;
      }

      // 2. TOP 10 산정 (재생수 기준)
      const top10 = [...allMusicList]
        .sort((a, b) => (b.views || 0) - (a.views || 0))
        .slice(0, 10);
      renderTop10List(top10);

      // 3. 전체 목록 렌더링
      renderMusicList(allMusicList);
    });

    // 오노추 메인 대형 카드 렌더링
    function renderOnochuCard(music) {
      const container = document.getElementById("onochuContainer");
      if (!music) return;

      container.innerHTML = `
        <div class="relative overflow-hidden bg-gradient-to-r from-indigo-900 via-slate-900 to-purple-950 rounded-3xl p-6 sm:p-8 text-white shadow-2xl border border-indigo-500/30 flex flex-col lg:flex-row items-center gap-6">
          <div class="w-full lg:w-1/2 aspect-video rounded-2xl overflow-hidden shadow-lg border border-white/10 flex-shrink-0">
            <iframe src="https://www.youtube.com/embed/${music.videoId}" class="w-full h-full border-0" allowfullscreen></iframe>
          </div>
          <div class="flex-1 text-center lg:text-left space-y-3 w-full">
            <div class="flex items-center justify-between">
              <span class="inline-block px-3 py-1 bg-indigo-500/20 border border-indigo-400/40 text-indigo-300 rounded-full text-xs font-black tracking-widest uppercase">
                ✨ TODAY'S PICK
              </span>
              <span class="text-xs text-indigo-200 font-semibold">👤 ${music.uploader || '익명'} 추천</span>
            </div>
            <h2 class="text-2xl sm:text-3xl font-black tracking-tight text-white line-clamp-2">${music.title}</h2>
            <p class="text-sm text-slate-300 font-semibold">${music.artist}</p>
            <div class="pt-2 flex flex-wrap gap-3 justify-center lg:justify-start">
              <a href="https://www.youtube.com/watch?v=${music.videoId}" target="_blank" onclick="handlePlayCount('${music.id}')" class="inline-flex items-center gap-1.5 px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold transition shadow-sm">
                <span>🔗 유튜브에서 보기</span>
              </a>
            </div>
          </div>
        </div>
      `;
    }

    // TOP 10 렌더링
    function renderTop10List(list) {
      const container = document.getElementById("top10Container");
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-xs font-bold py-4">인기곡 데이터가 없습니다.</p>`;
        return;
      }

      list.forEach((music, index) => {
        const item = document.createElement("div");
        item.className = "flex-shrink-0 w-60 bg-white border border-slate-200 rounded-2xl p-3 shadow-sm hover:shadow-md transition group flex flex-col justify-between relative";
        
        item.innerHTML = `
          <div>
            <div class="relative w-full aspect-video rounded-xl overflow-hidden mb-2 bg-slate-100">
              <span class="absolute top-1.5 left-1.5 z-10 bg-indigo-600 text-white font-black text-xs px-2 py-0.5 rounded-lg shadow-md">
                ${index + 1}위
              </span>
              <iframe src="https://www.youtube.com/embed/${music.videoId}" class="w-full h-full border-0" allowfullscreen></iframe>
            </div>
            <h4 class="font-bold text-xs text-slate-900 truncate" title="${music.title}">${music.title}</h4>
            <p class="text-[11px] text-slate-500 font-semibold truncate mt-0.5">${music.artist}</p>
            <p class="text-[10px] text-indigo-500 font-medium mt-1 truncate">👤 ${music.uploader || '익명'}</p>
          </div>
          <div class="flex items-center justify-between mt-3 pt-2 border-t border-slate-100 text-[10px]">
            <span class="text-slate-400 font-bold">🎧 ${music.views || 0}회</span>
            <a href="https://www.youtube.com/watch?v=${music.videoId}" target="_blank" onclick="handlePlayCount('${music.id}')" class="text-red-600 hover:underline font-extrabold flex items-center gap-0.5">
              유튜브 ↗
            </a>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // 전체 리스트 렌더링
    window.renderMusicList = function(list) {
      const container = document.getElementById("musicListContainer");
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-bold text-sm">검색 결과 또는 등록된 노래가 없습니다.</div>`;
        return;
      }

      list.forEach((music) => {
        const card = document.createElement("div");
        card.className = "bg-white border border-slate-200 rounded-2xl p-4 flex flex-col justify-between shadow-sm hover:shadow-md transition group relative";
        
        card.innerHTML = `
          <div>
            <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-slate-100 mb-3">
              <button onclick="deleteMusic('${music.id}', '${music.title}')" title="삭제" class="absolute top-2 right-2 z-20 bg-slate-900/80 hover:bg-red-600 text-white rounded-lg p-1.5 transition text-xs flex items-center justify-center">
                🗑️
              </button>
              <iframe src="https://www.youtube.com/embed/${music.videoId}" class="w-full h-full border-0" allowfullscreen></iframe>
            </div>
            <h3 class="font-bold text-slate-900 text-sm truncate" title="${music.title}">${music.title}</h3>
            <p class="text-xs text-slate-500 font-semibold mt-0.5 truncate">${music.artist}</p>
            <p class="text-[11px] text-indigo-600 font-medium mt-1.5 truncate">👤 추천: ${music.uploader || '익명'}</p>
          </div>
          <div class="flex items-center justify-between pt-3 mt-3 border-t border-slate-100">
            <span class="text-[10px] text-slate-400 font-semibold">조회 ${music.views || 0}회</span>
            <a href="https://www.youtube.com/watch?v=${music.videoId}" target="_blank" onclick="handlePlayCount('${music.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 text-[11px] font-bold px-2.5 py-1 rounded-lg transition flex items-center gap-1">
              ▶ 유튜브 이동
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    };

    // 삭제 기능
    window.deleteMusic = async function(id, title) {
      if (confirm(`'${title}' 노래를 정말로 삭제하시겠습니까?`)) {
        try {
          await window.deleteDoc(window.doc(window.db, "music_list", id));
          alert("성공적으로 삭제되었습니다.");
        } catch (e) {
          alert("삭제 실패: " + e.message);
        }
      }
    };

    // 클릭수 증가
    window.handlePlayCount = async function(id) {
      try {
        const musicRef = window.doc(window.db, "music_list", id);
        await window.updateDoc(musicRef, {
          views: window.increment(1)
        });
      } catch (e) {
        console.error("클릭수 업데이트 실패:", e);
      }
    };

    window.getAllMusicList = () => allMusicList;
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-20 antialiased">

  <!-- 내비게이션 바 -->
  <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
    <div class="flex items-center gap-4 flex-1 max-w-xl">
      <h1 class="text-xl font-black text-indigo-600 tracking-tight whitespace-nowrap">🔥 오노추</h1>
      <div class="relative w-full">
        <input type="text" id="searchInput" placeholder="노래, 가수, 작성자 검색..." class="w-full bg-slate-100 border border-slate-200 rounded-full pl-9 pr-4 py-2 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 focus:bg-white transition">
        <span class="absolute left-3 top-2.5 text-xs text-slate-400">🔍</span>
      </div>
    </div>

    <button id="openModalBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold px-4 py-2 rounded-full text-xs transition shadow-sm flex items-center gap-1.5 whitespace-nowrap">
      <span>+</span>
      <span>링크 업로드</span>
    </button>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-8 pt-8 space-y-10">
    
    <!-- 1. 대형 '오늘의 노래 추천' 섹션 -->
    <section id="onochuContainer">
      <div class="bg-slate-200 animate-pulse rounded-3xl h-64 w-full"></div>
    </section>

    <!-- 2. 인기 노래 TOP 10 섹션 -->
    <section>
      <h3 class="text-lg font-black text-slate-900 mb-4 flex items-center gap-2">
        <span>🔥 인기 노래 TOP 10</span>
      </h3>
      <div id="top10Container" class="flex gap-4 overflow-x-auto pb-4 scrollbar-hide">
      </div>
    </section>

    <!-- 3. 전체 노래 목록 -->
    <section>
      <h3 class="text-lg font-black text-slate-900 mb-4">
        <span>🎵 최근 올라온 노래</span>
      </h3>
      <div id="musicListContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
      </div>
    </section>

  </main>

  <!-- 유튜브 링크 업로드 모달 -->
  <div id="uploadModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white border border-slate-200 w-full max-w-lg rounded-3xl p-6 shadow-2xl relative">
      <button id="closeModalBtn" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>

      <h2 class="text-lg font-black text-slate-900 mb-1">🔗 오노추 링크 등록</h2>
      <p class="text-xs text-slate-500 mb-6">유튜브 주소를 입력해 추천 노래를 등록해 보세요.</p>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">유튜브 영상 주소 (URL)</label>
          <div class="flex gap-2">
            <input type="url" id="ytUrlInput" placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 font-mono">
            <button id="fetchYtBtn" class="px-3.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold whitespace-nowrap transition">
              불러오기
            </button>
          </div>
        </div>

        <form id="uploadForm" class="pt-4 border-t border-slate-100 space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">작성자 (닉네임)</label>
            <input type="text" id="uploaderInput" required placeholder="추천인 이름/닉네임" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 font-bold">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">노래 제목</label>
            <input type="text" id="titleInput" required placeholder="곡 제목" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 font-bold">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">가수 이름</label>
            <input type="text" id="artistInput" required placeholder="가수명" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 font-bold">
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3 rounded-xl text-xs transition shadow-sm mt-4">
            오노추 등록하기
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const uploadModal = document.getElementById('uploadModal');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');

    openModalBtn.addEventListener('click', () => uploadModal.classList.remove('hidden'));
    closeModalBtn.addEventListener('click', () => uploadModal.classList.add('hidden'));

    // 검색 기능 (제목, 가수, 작성자 검색 지원)
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase().trim();
      const allMusic = window.getAllMusicList();
      const filtered = allMusic.filter(m => 
        m.title.toLowerCase().includes(keyword) || 
        m.artist.toLowerCase().includes(keyword) ||
        (m.uploader && m.uploader.toLowerCase().includes(keyword))
      );
      window.renderMusicList(filtered);
    });

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // 유튜브 정보 불러오기
    document.getElementById('fetchYtBtn').addEventListener('click', async () => {
      const url = document.getElementById('ytUrlInput').value.trim();
      const videoId = extractVideoId(url);

      if (!videoId) return alert("유효한 유튜브 링크를 입력해 주세요.");

      const fetchBtn = document.getElementById('fetchYtBtn');
      fetchBtn.disabled = true;
      fetchBtn.innerText = "불러오는 중...";

      try {
        const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
        const data = await res.json();

        if (data.title) {
          document.getElementById('titleInput').value = data.title;
          document.getElementById('artistInput').value = data.author_name;
          alert("노래 정보를 성공적으로 불러왔습니다!");
        } else {
          alert("정보를 가져올 수 없는 링크입니다.");
        }
      } catch (err) {
        alert("오류가 발생했습니다.");
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.innerText = "불러오기";
      }
    });

    // 최종 등록
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const uploader = document.getElementById('uploaderInput').value.trim();
      const title = document.getElementById('titleInput').value.trim();
      const artist = document.getElementById('artistInput').value.trim();
      const ytUrl = document.getElementById('ytUrlInput').value.trim();
      const videoId = extractVideoId(ytUrl);
      const submitBtn = document.getElementById('submitBtn');

      if (!videoId) return alert("유튜브 링크를 올바르게 입력해 주세요.");

      submitBtn.disabled = true;
      submitBtn.innerText = "등록 중...";

      try {
        await window.addDoc(window.collection(window.db, "music_list"), {
          uploader: uploader,
          title: title,
          artist: artist,
          videoId: videoId,
          views: 0,
          createdAt: window.serverTimestamp()
        });

        alert("성공적으로 등록되었습니다!");
        document.getElementById('uploadForm').reset();
        document.getElementById('ytUrlInput').value = "";
        uploadModal.classList.add('hidden');
      } catch (err) {
        alert("등록 실패: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "오노추 등록하기";
      }
    });
  </script>
</body>
</html>
