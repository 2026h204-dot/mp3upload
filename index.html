<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오노추 - 오늘의 노래 추천</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc, deleteDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADfqll8HrBOzgPqYJ3gyZIgvq1WJzC9no",
      authDomain: "mp3upload-7cbc9.firebaseapp.com",
      projectId: "mp3upload-7cbc9",
      storageBucket: "mp3upload-7cbc9.firebasestorage.app",
      messagingSenderId: "1084960007120",
      appId: "1:1084960007120:web:2dbf711f9d1f9a85350fd5",
      measurementId: "G-81S0J2LRT2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.db = db;
    window.addDoc = addDoc;
    window.collection = collection;
    window.doc = doc;
    window.updateDoc = updateDoc;
    window.deleteDoc = deleteDoc;
    window.increment = increment;
    window.serverTimestamp = serverTimestamp;

    window.isAdmin = false;

    onAuthStateChanged(auth, (user) => {
      const loginBtn = document.getElementById("loginBtn");
      const userProfile = document.getElementById("userProfile");
      const userName = document.getElementById("userName");
      const userAvatar = document.getElementById("userAvatar");
      const uploaderInput = document.getElementById("uploaderInput");

      if (user) {
        if (loginBtn) loginBtn.classList.add("hidden");
        if (userProfile) {
          userProfile.classList.remove("hidden");
          userProfile.classList.add("flex");
        }
        if (userName) userName.innerText = user.displayName || "구글 사용자";
        if (userAvatar && user.photoURL) userAvatar.src = user.photoURL;
        
        if (uploaderInput) {
          uploaderInput.value = user.displayName || "";
          uploaderInput.readOnly = true;
        }
      } else {
        if (loginBtn) loginBtn.classList.remove("hidden");
        if (userProfile) {
          userProfile.classList.add("hidden");
          userProfile.classList.remove("flex");
        }
        if (uploaderInput) {
          uploaderInput.value = "";
          uploaderInput.readOnly = false;
        }
      }
    });

    window.loginWithGoogle = async function() {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        alert("구글 로그인 실패: " + error.message);
      }
    };

    window.logoutGoogle = async function() {
      try {
        await signOut(auth);
      } catch (error) {
        alert("로그아웃 실패: " + error.message);
      }
    };

    window.toggleAdminMode = function() {
      const adminBadge = document.getElementById("adminBadge");
      const adminBtn = document.getElementById("adminLoginBtn");

      if (window.isAdmin) {
        window.isAdmin = false;
        if (adminBadge) adminBadge.classList.add("hidden");
        if (adminBtn) adminBtn.innerText = "🔒 관리자 Login";
        alert("관리자 모드가 해제되었습니다.");
        filterAndRenderMusic();
        return;
      }

      const inputPw = prompt("관리자 비밀번호를 입력하세요:");
      if (inputPw === null) return;

      if (inputPw === "1202") {
        window.isAdmin = true;
        if (adminBadge) adminBadge.classList.remove("hidden");
        if (adminBtn) adminBtn.innerText = "🔓 관리자 Logout";
        alert("관리자 로그인 성공!");
        filterAndRenderMusic();
      } else {
        alert("비밀번호가 올바르지 않습니다.");
      }
    };

    let allMusicList = [];

    const q = query(collection(db, "music_list"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      allMusicList = [];
      snapshot.forEach((docSnap) => {
        allMusicList.push({ id: docSnap.id, ...docSnap.data() });
      });

      if (allMusicList.length > 0) {
        if (!window.selectedOnochu || !allMusicList.some(m => m.id === window.selectedOnochu.id)) {
          const randomIndex = Math.floor(Math.random() * allMusicList.length);
          window.selectedOnochu = allMusicList[randomIndex];
        }
        renderOnochuCard(window.selectedOnochu);
      } else {
        document.getElementById("onochuContainer").innerHTML = `<div class="bg-slate-900 rounded-3xl p-8 text-center text-slate-400 font-bold">등록된 노래가 없습니다. 첫 노래를 공유해 보세요!</div>`;
      }

      const top10 = [...allMusicList]
        .sort((a, b) => (b.views || 0) - (a.views || 0))
        .slice(0, 10);
      renderTop10List(top10);

      filterAndRenderMusic();
    }, (error) => {
      console.error("Firestore 연결 실패:", error);
    });

    // 클릭 시 유튜브 페이지로 바로 이동
    window.openYoutube = function(id, videoId) {
      if (id && window.db) {
        try {
          const musicRef = window.doc(window.db, "music_list", id);
          window.updateDoc(musicRef, { views: window.increment(1) });
        } catch (e) {
          console.error(e);
        }
      }
      window.open(`https://www.youtube.com/watch?v=${videoId}`, '_blank');
    };

    function renderOnochuCard(music) {
      const container = document.getElementById("onochuContainer");
      if (!music) return;

      container.innerHTML = `
        <div onclick="window.openYoutube('${music.id}', '${music.videoId}')" class="group cursor-pointer relative overflow-hidden bg-gradient-to-r from-indigo-900 via-slate-900 to-purple-950 rounded-3xl p-8 text-white shadow-xl border border-indigo-500/30 hover:border-indigo-400 transition-all">
          <div class="flex items-center justify-between mb-4">
            <span class="px-3 py-1 bg-indigo-500/20 border border-indigo-400/40 text-indigo-300 rounded-full text-xs font-black tracking-widest uppercase">
              ✨ TODAY'S PICK
            </span>
            <span class="text-xs text-indigo-200 font-semibold">👤 ${music.uploader || '익명'} 추천</span>
          </div>
          <div class="space-y-2">
            <h2 class="text-2xl sm:text-3xl font-black text-white group-hover:text-indigo-300 transition line-clamp-1">${music.title}</h2>
            <p class="text-base sm:text-lg text-slate-300 font-bold">${music.artist}</p>
          </div>
          <div class="mt-6 flex items-center justify-between pt-4 border-t border-white/10">
            <span class="text-xs text-slate-400">🎧 조회수 ${music.views || 0}회</span>
            <span class="bg-red-600 group-hover:bg-red-500 text-white font-extrabold px-4 py-2 rounded-xl text-xs flex items-center gap-1.5 transition shadow-lg">
              ▶ 클릭해서 유튜브 이동
            </span>
          </div>
        </div>
      `;
    }

    function renderTop10List(list) {
      const container = document.getElementById("top10Container");
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-xs font-bold py-4">인기곡 데이터가 없습니다.</p>`;
        return;
      }

      list.forEach((music, index) => {
        const item = document.createElement("div");
        item.onclick = () => window.openYoutube(music.id, music.videoId);
        item.className = "flex-shrink-0 w-64 bg-white border border-slate-200 hover:border-indigo-400 rounded-2xl p-4 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between group";
        
        item.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="bg-indigo-600 text-white font-black text-xs px-2.5 py-0.5 rounded-lg">
                ${index + 1}위
              </span>
              <span class="text-[10px] text-slate-400 font-bold">👤 ${music.uploader || '익명'}</span>
            </div>
            <h4 class="font-black text-sm text-slate-900 group-hover:text-indigo-600 transition truncate mt-1" title="${music.title}">${music.title}</h4>
            <p class="text-xs text-slate-500 font-bold truncate mt-0.5">${music.artist}</p>
          </div>
          <div class="flex items-center justify-between mt-4 pt-2 border-t border-slate-100 text-[11px]">
            <span class="text-slate-400 font-bold">🎧 ${music.views || 0}회</span>
            <span class="text-red-600 font-black group-hover:underline">▶ 유튜브에서 보기 ↗</span>
          </div>
        `;
        container.appendChild(item);
      });
    }

    window.filterAndRenderMusic = function() {
      const searchInput = document.getElementById('searchInput');
      const keyword = searchInput ? searchInput.value.toLowerCase().trim() : '';
      
      const filtered = allMusicList.filter(m => {
        const titleMatch = m.title ? m.title.toLowerCase().includes(keyword) : false;
        const artistMatch = m.artist ? m.artist.toLowerCase().includes(keyword) : false;
        const uploaderMatch = m.uploader ? m.uploader.toLowerCase().includes(keyword) : false;
        return titleMatch || artistMatch || uploaderMatch;
      });

      renderMusicList(filtered);
    };

    window.renderMusicList = function(list) {
      const container = document.getElementById("musicListContainer");
      if (!container) return;
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-bold text-sm">검색 결과 또는 등록된 노래가 없습니다.</div>`;
        return;
      }

      list.forEach((music) => {
        const card = document.createElement("div");
        card.className = "bg-white border border-slate-200 hover:border-indigo-400 rounded-2xl p-5 flex flex-col justify-between shadow-sm hover:shadow-md transition cursor-pointer group relative";
        
        card.onclick = (e) => {
          if (e.target.tagName === 'BUTTON') return;
          window.openYoutube(music.id, music.videoId);
        };

        const deleteBtnHtml = window.isAdmin ? `
          <button onclick="deleteMusic('${music.id}', '${music.title}'); event.stopPropagation();" title="삭제 (관리자 전용)" class="bg-red-100 hover:bg-red-200 text-red-600 rounded-lg px-2 py-1 transition text-xs font-bold">
            🗑️ 삭제
          </button>
        ` : '';

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs text-indigo-600 font-bold">👤 ${music.uploader || '익명'}</span>
              ${deleteBtnHtml}
            </div>
            <h3 class="font-black text-slate-900 text-base group-hover:text-indigo-600 transition truncate" title="${music.title}">${music.title}</h3>
            <p class="text-xs text-slate-500 font-bold mt-1 truncate">${music.artist}</p>
          </div>
          <div class="flex items-center justify-between pt-4 mt-4 border-t border-slate-100 text-xs">
            <span class="text-slate-400 font-bold">🎧 조회 ${music.views || 0}회</span>
            <span class="text-red-600 font-extrabold flex items-center gap-1 group-hover:underline">
              ▶ 유튜브 바로가기
            </span>
          </div>
        `;
        container.appendChild(card);
      });
    };

    window.deleteMusic = async function(id, title) {
      if (!window.isAdmin) {
        alert("삭제 권한이 없습니다.");
        return;
      }
      if (confirm(`'${title}' 노래를 삭제하시겠습니까?`)) {
        try {
          await window.deleteDoc(window.doc(window.db, "music_list", id));
          alert("삭제되었습니다.");
        } catch (e) {
          alert("삭제 실패: " + e.message);
        }
      }
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between antialiased">

  <div>
    <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 flex-1 max-w-xl">
        <h1 class="text-xl font-black text-indigo-600 tracking-tight whitespace-nowrap">🔥 오노추</h1>
        <span id="adminBadge" class="hidden bg-red-100 text-red-600 border border-red-200 text-[10px] font-extrabold px-2 py-0.5 rounded-full">ADMIN</span>
        <div class="relative w-full">
          <input type="text" id="searchInput" oninput="filterAndRenderMusic()" placeholder="노래, 가수, 작성자 실시간 검색..." class="w-full bg-slate-100 border border-slate-200 rounded-full pl-9 pr-4 py-2 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 focus:bg-white transition">
          <span class="absolute left-3 top-2.5 text-xs text-slate-400">🔍</span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button id="loginBtn" onclick="loginWithGoogle()" class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold px-3 py-1.5 rounded-full text-xs transition shadow-sm flex items-center gap-2">
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          <span>구글 로그인</span>
        </button>

        <div id="userProfile" class="hidden items-center gap-2 bg-slate-100 border border-slate-200 px-3 py-1 rounded-full">
          <img id="userAvatar" src="" class="w-6 h-6 rounded-full object-cover">
          <span id="userName" class="text-xs font-bold text-slate-700"></span>
          <button onclick="logoutGoogle()" class="text-[10px] text-slate-400 hover:text-red-600 font-bold ml-1">로그아웃</button>
        </div>

        <button id="openModalBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold px-4 py-2 rounded-full text-xs transition shadow-sm flex items-center gap-1.5 whitespace-nowrap">
          <span>+</span>
          <span>링크 업로드</span>
        </button>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-8 pt-8 space-y-10 mb-16">
      <section id="onochuContainer">
        <div class="bg-slate-200 animate-pulse rounded-3xl h-48 w-full"></div>
      </section>

      <section>
        <h3 class="text-lg font-black text-slate-900 mb-4 flex items-center gap-2">
          <span>🔥 인기 노래 TOP 10</span>
        </h3>
        <div id="top10Container" class="flex gap-4 overflow-x-auto pb-4"></div>
      </section>

      <section>
        <h3 class="text-lg font-black text-slate-900 mb-4">
          <span>🎵 최근 올라온 노래</span>
        </h3>
        <div id="musicListContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
      </section>
    </main>
  </div>

  <footer class="bg-slate-100 border-t border-slate-200 py-6 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <p>© 2026 오노추 - 오늘의 노래 추천 서비스</p>
      <button id="adminLoginBtn" onclick="window.toggleAdminMode()" class="text-slate-400 hover:text-slate-600 font-semibold underline cursor-pointer">
        🔒 관리자 Login
      </button>
    </div>
  </footer>

  <div id="uploadModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white border border-slate-200 w-full max-w-lg rounded-3xl p-6 shadow-2xl relative">
      <button id="closeModalBtn" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>

      <h2 class="text-lg font-black text-slate-900 mb-1">🔗 오노추 링크 등록</h2>
      <p class="text-xs text-slate-500 mb-6">유튜브 주소를 입력해 추천 노래를 등록해 보세요.</p>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">유튜브 영상 주소 (URL)</label>
          <div class="flex gap-2">
            <input type="url" id="ytUrlInput" placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 font-mono">
            <button id="fetchYtBtn" class="px-3.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold whitespace-nowrap transition">
              불러오기
            </button>
          </div>
        </div>

        <form id="uploadForm" class="pt-4 border-t border-slate-100 space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">작성자 (구글 로그인 시 자동 고정)</label>
            <input type="text" id="uploaderInput" required placeholder="추천인 이름/닉네임" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 font-bold">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">노래 제목</label>
            <input type="text" id="titleInput" required placeholder="곡 제목" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 font-bold">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">가수 이름</label>
            <input type="text" id="artistInput" required placeholder="가수명" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 font-bold">
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3 rounded-xl text-xs transition shadow-sm mt-4">
            오노추 등록하기
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const uploadModal = document.getElementById('uploadModal');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');

    openModalBtn.addEventListener('click', () => uploadModal.classList.remove('hidden'));
    closeModalBtn.addEventListener('click', () => uploadModal.classList.add('hidden'));

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    document.getElementById('fetchYtBtn').addEventListener('click', async () => {
      const url = document.getElementById('ytUrlInput').value.trim();
      const videoId = extractVideoId(url);

      if (!videoId) return alert("유효한 유튜브 링크를 입력해 주세요.");

      const fetchBtn = document.getElementById('fetchYtBtn');
      fetchBtn.disabled = true;
      fetchBtn.innerText = "불러오는 중...";

      try {
        const targetUrl = encodeURIComponent(`https://www.youtube.com/watch?v=${videoId}`);
        const res = await fetch(`https://www.youtube.com/oembed?url=${targetUrl}&format=json`);
        
        if (res.ok) {
          const data = await res.json();
          document.getElementById('titleInput').value = data.title || "";
          document.getElementById('artistInput').value = data.author_name || "";
          alert("노래 정보를 불러왔습니다!");
        } else {
          alert("정보를 불러오지 못했습니다. 직접 입력해 주세요.");
        }
      } catch (err) {
        alert("정보 자동 생성 실패! 직접 입력해 주세요.");
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.innerText = "불러오기";
      }
    });

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const uploader = document.getElementById('uploaderInput').value.trim();
      const title = document.getElementById('titleInput').value.trim();
      const artist = document.getElementById('artistInput').value.trim();
      const ytUrl = document.getElementById('ytUrlInput').value.trim();
      const videoId = extractVideoId(ytUrl);
      const submitBtn = document.getElementById('submitBtn');

      if (!videoId) return alert("유튜브 링크를 올바르게 입력해 주세요.");

      submitBtn.disabled = true;
      submitBtn.innerText = "등록 중...";

      try {
        await window.addDoc(window.collection(window.db, "music_list"), {
          uploader: uploader,
          title: title,
          artist: artist,
          videoId: videoId,
          views: 0,
          createdAt: window.serverTimestamp()
        });

        alert("등록되었습니다!");
        document.getElementById('uploadForm').reset();
        document.getElementById('ytUrlInput').value = "";
        uploadModal.classList.add('hidden');
      } catch (err) {
        alert("등록 실패: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "오노추 등록하기";
      }
    });
  </script>
</body>
</html>
