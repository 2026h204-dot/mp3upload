<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오노추 - 오늘의 노래 추천</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc, deleteDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADfqll8HrBOzgPqYJ3gyZIgvq1WJzC9no",
      authDomain: "mp3upload-7cbc9.firebaseapp.com",
      projectId: "mp3upload-7cbc9",
      storageBucket: "mp3upload-7cbc9.firebasestorage.app",
      messagingSenderId: "1084960007120",
      appId: "1:1084960007120:web:2dbf711f9d1f9a85350fd5",
      measurementId: "G-81S0J2LRT2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.db = db;
    window.addDoc = addDoc;
    window.collection = collection;
    window.doc = doc;
    window.updateDoc = updateDoc;
    window.deleteDoc = deleteDoc;
    window.increment = increment;
    window.serverTimestamp = serverTimestamp;

    let currentUser = null;
    window.isAdmin = false;

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const loginBtn = document.getElementById("loginBtn");
      const userProfile = document.getElementById("userProfile");
      const userName = document.getElementById("userName");
      const userAvatar = document.getElementById("userAvatar");
      const uploaderInput = document.getElementById("uploaderInput");

      if (user) {
        if (loginBtn) loginBtn.classList.add("hidden");
        if (userProfile) {
          userProfile.classList.remove("hidden");
          userProfile.classList.add("flex");
        }
        if (userName) userName.innerText = user.displayName || "구글 사용자";
        if (userAvatar && user.photoURL) userAvatar.src = user.photoURL;
        
        if (uploaderInput) {
          uploaderInput.value = user.displayName || "";
          uploaderInput.readOnly = true;
        }
      } else {
        if (loginBtn) loginBtn.classList.remove("hidden");
        if (userProfile) {
          userProfile.classList.add("hidden");
          userProfile.classList.remove("flex");
        }
        if (uploaderInput) {
          uploaderInput.value = "";
          uploaderInput.readOnly = false;
        }
      }
    });

    window.loginWithGoogle = async function() {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("로그인 실패:", error);
        alert("구글 로그인 실패: " + error.message);
      }
    };

    window.logoutGoogle = async function() {
      try {
        await signOut(auth);
      } catch (error) {
        alert("로그아웃 실패: " + error.message);
      }
    };

    // 🔑 안정화된 관리자 모드 토글 함수
    window.toggleAdminMode = function() {
      const adminBadge = document.getElementById("adminBadge");
      const adminBtn = document.getElementById("adminLoginBtn");

      if (window.isAdmin) {
        window.isAdmin = false;
        if (adminBadge) adminBadge.classList.add("hidden");
        if (adminBtn) adminBtn.innerText = "🔒 관리자 Login";
        alert("관리자 모드가 해제되었습니다.");
        filterAndRenderMusic();
        return;
      }

      const inputPw = prompt("관리자 비밀번호를 입력하세요:");
      if (inputPw === null) return; // 취소 누른 경우

      if (inputPw === "1202") {
        window.isAdmin = true;
        if (adminBadge) adminBadge.classList.remove("hidden");
        if (adminBtn) adminBtn.innerText = "🔓 관리자 Logout";
        alert("관리자 로그인 성공!");
        filterAndRenderMusic();
      } else {
        alert("비밀번호가 올바르지 않습니다.");
      }
    };

    let allMusicList = [];

    const q = query(collection(db, "music_list"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      allMusicList = [];
      snapshot.forEach((docSnap) => {
        allMusicList.push({ id: docSnap.id, ...docSnap.data() });
      });

      if (allMusicList.length > 0) {
        if (!window.selectedOnochu || !allMusicList.some(m => m.id === window.selectedOnochu.id)) {
          const randomIndex = Math.floor(Math.random() * allMusicList.length);
          window.selectedOnochu = allMusicList[randomIndex];
        }
        renderOnochuCard(window.selectedOnochu);
      } else {
        document.getElementById("onochuContainer").innerHTML = `<div class="bg-slate-900 rounded-3xl p-8 text-center text-slate-400 font-bold">등록된 노래가 없습니다. 첫 노래를 공유해 보세요!</div>`;
      }

      const top10 = [...allMusicList]
        .sort((a, b) => (b.views || 0) - (a.views || 0))
        .slice(0, 10);
      renderTop10List(top10);

      filterAndRenderMusic();
    }, (error) => {
      console.error("Firestore 연결 실패:", error);
    });

    function getThumbUrl(videoId) {
      return `https://wsrv.nl/?url=https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
    }

    window.openYoutube = function(id, videoId) {
      if (id && window.db) {
        try {
          const musicRef = window.doc(window.db, "music_list", id);
          window.updateDoc(musicRef, {
            views: window.increment(1)
          });
        } catch (e) {
          console.error(e);
        }
      }
      window.open(`
