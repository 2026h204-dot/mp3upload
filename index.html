<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 음원 라이브러리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDK 모듈 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADfqll8HrBOzgPqYJ3gyZIgvq1WJzC9no",
      authDomain: "mp3upload-7cbc9.firebaseapp.com",
      projectId: "mp3upload-7cbc9",
      storageBucket: "mp3upload-7cbc9.firebasestorage.app",
      messagingSenderId: "1084960007120",
      appId: "1:1084960007120:web:2dbf711f9d1f9a85350fd5",
      measurementId: "G-81S0J2LRT2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    window.db = db;
    window.storage = storage;
    window.addDoc = addDoc;
    window.collection = collection;
    window.ref = ref;
    window.uploadBytes = uploadBytes;
    window.getDownloadURL = getDownloadURL;
    window.serverTimestamp = serverTimestamp;

    let allMusicList = [];

    // 실시간 음원 데이터베이스 구독
    const q = query(collection(db, "music_list"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      allMusicList = [];
      snapshot.forEach((doc) => {
        allMusicList.push({ id: doc.id, ...doc.data() });
      });

      // 개수 업데이트
      document.getElementById("totalCount").innerText = allMusicList.length;
      
      // 화면 렌더링
      renderMusicList(allMusicList);
    });

    // 화면 렌더링 함수
    window.renderMusicList = function(list) {
      const container = document.getElementById("musicListContainer");
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-20">
            <p class="text-slate-400 font-bold text-sm">검색 결과가 없거나 등록된 음원이 없습니다.</p>
          </div>
        `;
        return;
      }

      list.forEach((music) => {
        const card = document.createElement("div");
        card.className = "bg-white border border-slate-200 rounded-2xl p-4 flex flex-col justify-between shadow-sm hover:shadow-md transition group";
        
        card.innerHTML = `
          <div>
            <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-slate-100 mb-3 border border-slate-100">
              <img src="${music.thumbnail || 'https://via.placeholder.com/300'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="cover">
            </div>
            <h3 class="font-bold text-slate-900 text-sm truncate" title="${music.title}">${music.title}</h3>
            <p class="text-xs text-slate-500 font-semibold mt-0.5 mb-4 truncate">${music.artist}</p>
          </div>
          <audio controls class="w-full h-9 rounded-lg">
            <source src="${music.fileUrl}" type="audio/mp3">
            브라우저가 오디오 재생을 지원하지 않습니다.
          </audio>
        `;
        container.appendChild(card);
      });
    };

    window.getAllMusicList = () => allMusicList;
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-16 antialiased">

  <!-- 상단 내비게이션 바 -->
  <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
    
    <!-- 좌측: 로고 & 실시간 검색창 -->
    <div class="flex items-center gap-4 flex-1 max-w-xl">
      <h1 class="text-lg font-black text-slate-900 tracking-tight whitespace-nowrap">🎵 MP3 Hub</h1>
      <div class="relative w-full">
        <input type="text" id="searchInput" placeholder="제목이나 가수 이름 검색..." class="w-full bg-slate-100 border border-slate-200 rounded-full pl-9 pr-4 py-2 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 focus:bg-white transition">
        <span class="absolute left-3 top-2.5 text-xs text-slate-400">🔍</span>
      </div>
    </div>

    <!-- 우측: 업로드 모달 오픈 버튼 -->
    <button id="openModalBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold px-4 py-2 rounded-full text-xs transition shadow-sm flex items-center gap-1.5 whitespace-nowrap">
      <span>+</span>
      <span>음원 업로드</span>
    </button>
  </header>

  <!-- 메인 라이브러리 컨테이너 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-8 pt-8">
    
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-base font-black text-slate-900 flex items-center gap-2">
        <span>전체 음원 목록</span>
        <span id="totalCount" class="text-xs bg-indigo-50 text-indigo-600 border border-indigo-100 font-bold px-2 py-0.5 rounded-full">0</span>
      </h2>
    </div>

    <!-- 그리드 형태의 대용량 MP3 트랙 리스트 -->
    <div id="musicListContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
      <!-- JS로 음악 카드들 대량 출력 -->
    </div>

  </main>

  <!-- 업로드 모달 (팝업창) -->
  <div id="uploadModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white border border-slate-200 w-full max-w-lg rounded-3xl p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      
      <!-- 닫기 버튼 -->
      <button id="closeModalBtn" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>

      <h2 class="text-lg font-black text-slate-900 mb-1">🎵 새로운 음원 추가</h2>
      <p class="text-xs text-slate-500 mb-6">유튜브 링크 또는 MP3 파일을 라이브러리에 등록하세요.</p>

      <!-- 탭 선택 (유튜브 링크 / MP3 파일 업로드) -->
      <div class="flex border-b border-slate-100 mb-6">
        <button id="tabYt" class="pb-3 px-4 text-xs font-black text-indigo-600 border-b-2 border-indigo-600 transition">
          🔗 유튜브 링크
        </button>
        <button id="tabFile" class="pb-3 px-4 text-xs font-bold text-slate-400 hover:text-slate-600 transition">
          📁 MP3 파일
        </button>
      </div>

      <!-- 1. 유튜브 추출 영역 -->
      <div id="ytSection" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">유튜브 영상 주소 (URL)</label>
          <div class="flex gap-2">
            <input type="url" id="ytUrlInput" placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 font-mono">
            <button id="fetchYtBtn" class="px-3.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold whitespace-nowrap transition">
              불러오기
            </button>
          </div>
        </div>
      </div>

      <!-- 2. MP3 파일 업로드 영역 -->
      <div id="fileSection" class="hidden space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">MP3 파일 선택</label>
          <input type="file" id="fileInput" accept="audio/mp3, audio/*" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs text-slate-600 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        </div>
      </div>

      <!-- 공통 상세 정보 수정 폼 -->
      <form id="uploadForm" class="mt-6 pt-6 border-t border-slate-100 space-y-4">
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">노래 제목</label>
            <input type="text" id="titleInput" required placeholder="곡 제목을 입력하세요" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 font-bold">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">가수 이름</label>
            <input type="text" id="artistInput" required placeholder="가수/채널명을 입력하세요" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 font-bold">
          </div>
        </div>

        <input type="hidden" id="thumbnailInput" value="https://via.placeholder.com/300">

        <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3 rounded-xl text-xs transition shadow-sm mt-4">
          라이브러리에 업로드
        </button>
      </form>

    </div>
  </div>

  <script>
    let activeTab = 'yt';

    const uploadModal = document.getElementById('uploadModal');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');

    // 모달 열기 / 닫기
    openModalBtn.addEventListener('click', () => uploadModal.classList.remove('hidden'));
    closeModalBtn.addEventListener('click', () => uploadModal.classList.add('hidden'));

    // 실시간 검색 기능
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase().trim();
      const allMusic = window.getAllMusicList();

      const filtered = allMusic.filter(m => 
        m.title.toLowerCase().includes(keyword) || 
        m.artist.toLowerCase().includes(keyword)
      );

      window.renderMusicList(filtered);
    });

    // 탭 전환
    const tabYt = document.getElementById('tabYt');
    const tabFile = document.getElementById('tabFile');
    const ytSection = document.getElementById('ytSection');
    const fileSection = document.getElementById('fileSection');

    tabYt.addEventListener('click', () => {
      activeTab = 'yt';
      tabYt.className = "pb-3 px-4 text-xs font-black text-indigo-600 border-b-2 border-indigo-600 transition";
      tabFile.className = "pb-3 px-4 text-xs font-bold text-slate-400 hover:text-slate-600 transition";
      ytSection.classList.remove('hidden');
      fileSection.classList.add('hidden');
    });

    tabFile.addEventListener('click', () => {
      activeTab = 'file';
      tabFile.className = "pb-3 px-4 text-xs font-black text-indigo-600 border-b-2 border-indigo-600 transition";
      tabYt.className = "pb-3 px-4 text-xs font-bold text-slate-400 hover:text-slate-600 transition";
      fileSection.classList.remove('hidden');
      ytSection.classList.add('hidden');
    });

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // 유튜브 정보 불러오기
    document.getElementById('fetchYtBtn').addEventListener('click', async () => {
      const url = document.getElementById('ytUrlInput').value.trim();
      const videoId = extractVideoId(url);

      if (!videoId) return alert("유효한 유튜브 링크를 입력해 주세요.");

      const fetchBtn = document.getElementById('fetchYtBtn');
      fetchBtn.disabled = true;
      fetchBtn.innerText = "불러오는 중...";

      try {
        const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
        const data = await res.json();

        if (data.title) {
          document.getElementById('titleInput').value = data.title;
          document.getElementById('artistInput').value = data.author_name;
          document.getElementById('thumbnailInput').value = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
          alert("정보를 성공적으로 불러왔습니다!");
        } else {
          alert("정보를 가져올 수 없습니다.");
        }
      } catch (err) {
        alert("오류가 발생했습니다.");
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.innerText = "불러오기";
      }
    });

    // 최종 업로드
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('titleInput').value.trim();
      const artist = document.getElementById('artistInput').value.trim();
      const thumbnail = document.getElementById('thumbnailInput').value;
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.disabled = true;
      submitBtn.innerText = "업로드 중...";

      try {
        let finalFileUrl = "";

        if (activeTab === 'yt') {
          const ytUrl = document.getElementById('ytUrlInput').value.trim();
          const videoId = extractVideoId(ytUrl);
          if (!videoId) throw new Error("유튜브 링크를 확인해주세요.");

          finalFileUrl = `https://api.vevioz.com/api/button/mp3/${videoId}`;
        } else {
          const fileInput = document.getElementById('fileInput');
          const file = fileInput.files[0];
          if (!file) throw new Error("MP3 파일을 선택해 주세요.");

          const storageRef = window.ref(window.storage, `musics/${Date.now()}_${file.name}`);
          const snapshot = await window.uploadBytes(storageRef, file);
          finalFileUrl = await window.getDownloadURL(snapshot.ref);
        }

        await window.addDoc(window.collection(window.db, "music_list"), {
          title: title,
          artist: artist,
          thumbnail: thumbnail,
          fileUrl: finalFileUrl,
          createdAt: window.serverTimestamp()
        });

        alert("업로드가 완료되었습니다!");
        document.getElementById('uploadForm').reset();
        uploadModal.classList.add('hidden');
      } catch (err) {
        alert(err.message || "업로드 실패");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "라이브러리에 업로드";
      }
    });
  </script>
</body>
</html>
